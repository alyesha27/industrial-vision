services:
  detector:
    build: .
    image: abd-vision:1.0
    container_name: vision_detector
    command: python launcher.py            # источник берётся из SOURCE (см. .env)
    environment:
      SOURCE: ${SOURCE:-/dev/video0}
      HEADLESS: "1"
    devices:
      - /dev/video0:/dev/video0            # убрать, если SOURCE - видеофайл
    group_add:
      - video
    volumes:
      - ./events:/app/events               # события и snapshot
      - ./models:/app/models               # веса (unified.pt, ppe.pt ...)
      - ./configs:/app/configs
      - ./data:/app/data:ro                # тестовые видео
    restart: unless-stopped

  api:
    image: abd-vision:1.0
    container_name: vision_api
    command: python -m uvicorn src.api.server:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - ./events:/app/events
      - ./configs:/app/configs
    depends_on:
      - detector
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
