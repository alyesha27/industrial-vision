camera:
  id: cam_01
  source: 0              # 0 = камера; можно путь к видеофайлу
  reconnect_sec: 2

models:
  # Единая модель на все классы. Если файла нет, работает режим из трёх моделей ниже.
  unified_path: "models/unified.pt"
  class_confidence:      # порог для каждого класса единой модели
    person: 0.60
    car: 0.60
    truck: 0.60
    bus: 0.60
    helmet: 0.40
    head: 0.40
    vest: 0.40
    fire: 0.65
    smoke: 0.50
    water: 0.50

  # Режим из трёх моделей (запасной)
  detector_path: "yolo26n.pt"
  person_confidence: 0.60
  ppe_path: "models/ppe.pt"
  ppe_confidence: 0.40
  fire_smoke_path: "models/fire_smoke.pt"
  fire_confidence: 0.65
  smoke_confidence: 0.50
  extra_every: 2

  tracker: "bytetrack.yaml"
  min_person_height: 120

zones:
  restricted_01:         # нормированные координаты [0;1]
    - [0.15, 0.20]
    - [0.85, 0.20]
    - [0.90, 0.90]
    - [0.10, 0.90]
  anchor_mode:           # bottom_center | center | any
    person: bottom_center
    vehicle: any

events:
  confirmation_n: 3      # детекция в N из последних M кадров
  confirmation_m: 5
  cooldown_sec: 10

storage:
  root: "events"

spill:                   # эвристика; не используется, если единая модель знает класс water
  enabled: true
  min_area: 1200
  min_area_ratio: 0.0005
  max_area_ratio: 0.20
  min_saturation: 35
  max_value: 175
  ground_start_ratio: 0.45
